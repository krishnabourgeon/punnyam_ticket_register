org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Works around a Windows-only Kotlin Build Tools API bug where something
# (Defender/indexer) grabs a file handle on the incremental cache .tab files
# between when Kotlin writes and closes them, failing with
# "Could not close incremental caches". Disabling incremental Kotlin
# compilation avoids touching those cross-build cache files at all.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
